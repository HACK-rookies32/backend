name: CD

# ==================================================================
# main push -> 이미지 빌드 -> Docker Hub(private) push 까지가 이 워크플로의 끝.
#
# 그 뒤는 WAS EC2 의 watchtower 가 :latest 태그의 digest 변화를 폴링해서
# 알아서 컨테이너를 교체한다. 즉 이 워크플로에는 AWS 자격증명이 없다.
#
# ⚠️ 태그 전략이 이 구조의 핵심이다.
#    watchtower 는 "실행 중인 컨테이너가 쓰는 태그를 다시 pull 해서 digest 가
#    바뀌었는지" 만 본다. 새 태그를 찾아다니지 않는다.
#    그래서 :latest 라는 고정 태그를 매번 덮어써야 하고, EC2 의 컨테이너도
#    반드시 :latest 로 떠 있어야 한다. sha- 태그로 띄우면 영원히 갱신되지 않는다.
#
# 아래 IMAGE 는 infra 레포 variables.tf 의 var.was_image 와 반드시 일치해야 한다.
# 어긋나면 CI 는 성공하는데 배포만 조용히 안 되고 아무 에러도 나지 않는다.
# ==================================================================
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_to:
        description: '되돌릴 태그 (예: sha-a1b2c3d). 비워두면 현재 커밋을 새로 빌드해서 배포합니다.'
        required: false
        default: ''

permissions:
  contents: read

env:
  IMAGE: jotriever/kidhack-was

jobs:
  # ----------------------------------------------------------------
  # 롤백: 이미 Docker Hub 에 있는 이미지를 :latest 로 다시 가리키게만 한다.
  # 다시 빌드하지 않으므로 "그때 그 바이너리" 가 그대로 돌아온다.
  # imagetools 는 매니페스트만 조작해서 레이어를 내려받지 않는다.
  # ----------------------------------------------------------------
  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.rollback_to != ''
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 입력값을 run: 안에 ${{ }} 로 직접 박으면 셸 인젝션이 된다.
      # (워크플로를 수동 실행할 수 있는 사람이 러너에서 임의 명령을 돌릴 수 있음)
      # env 로 넘기면 셸 변수라 문자열로만 취급된다.
      - name: ':latest 를 지정한 태그로 되돌린다'
        env:
          ROLLBACK_TO: ${{ inputs.rollback_to }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            "$IMAGE:$ROLLBACK_TO"

      - name: 되돌린 digest 확인
        run: docker buildx imagetools inspect "$IMAGE:latest"

  # ----------------------------------------------------------------
  # 정상 배포
  # ----------------------------------------------------------------
  build-and-push:
    if: github.event_name == 'push' || inputs.rollback_to == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # gradlew 는 리포지터리에 100755 로 저장되어 있어야 리눅스 러너에서 실행된다.
      # Windows 는 core.fileMode=false 라 권한 변화를 추적하지 않으므로, 실수로
      # 100644 로 커밋되면 여기서 exit 126("실행 권한 없음")으로 죽는다.
      # 실제로 한 번 겪은 문제라 안전장치를 둔다.
      - name: gradlew 실행 권한
        run: chmod +x ./gradlew

      # ----------------------------------------------------------------
      # 운영 설정 주입
      #
      # application-prod.yml 은 레포에 없다(RDS 엔드포인트와 DB 계정명이
      # 들어가므로). GitHub Secrets 의 APPLICATION_PROD_YML 을 여기서 파일로
      # 복원해 bootJar 에 포함시킨다. 필요한 키는 레포의
      # src/main/resources/application-prod.yml.example 참고.
      #
      # base64 로 보관하는 이유: 여러 줄 YAML 을 시크릿에 그대로 넣으면
      # 들여쓰기가 깨지기 쉽고, 액션의 마스킹도 줄 단위라 조각이 로그에 남을 수 있다.
      #
      # ⚠️ 비어 있으면 즉시 실패시킨다. 시크릿이 없는 채로 빌드하면 prod
      #    프로파일이 비어 로컬 설정(H2 / localhost)이 그대로 운영에 나가는데,
      #    앱은 정상 기동해 버려서 아무도 모른 채 데이터가 메모리에 쌓인다.
      # ----------------------------------------------------------------
      - name: application-prod.yml 복원
        env:
          APPLICATION_PROD_YML: ${{ secrets.APPLICATION_PROD_YML }}
        run: |
          if [ -z "$APPLICATION_PROD_YML" ]; then
            echo "FATAL: APPLICATION_PROD_YML 시크릿이 비어 있다."
            exit 1
          fi
          printf '%s' "$APPLICATION_PROD_YML" | base64 -d \
            > src/main/resources/application-prod.yml
          # 값은 절대 출력하지 않는다. 복원이 됐는지만 최상위 키로 확인한다.
          echo "복원된 최상위 키:"
          grep -E '^[a-z][a-z-]*:' src/main/resources/application-prod.yml

      # main 에 들어온 뒤에도 한 번 더 돌린다. PR 이후 다른 PR 이 머지되어
      # 조합이 깨지는 경우(semantic conflict)를 여기서 잡는다.
      #
      # 위에서 prod yml 을 복원했지만 테스트는 프로파일을 켜지 않으므로
      # 그대로 H2 로 돈다(러너에서 RDS 로는 애초에 접속할 수 없다).
      - name: 테스트
        run: ./gradlew test

      - name: bootJar
        run: ./gradlew bootJar

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 짧은 SHA 를 쓴다. 전체 40자는 롤백할 때 사람이 옮겨 적기 어렵다.
      - name: 태그 계산
        id: meta
        run: echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: 빌드 & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 배포가 실제로 반영됐는지 확인할 때 이 digest 를 기준으로 삼는다.
      # 태그 이름은 그대로여도 digest 가 안 바뀌었다면 watchtower 는 아무것도 안 한다.
      - name: 배포된 digest
        run: |
          echo "롤백이 필요하면 이 태그를 쓰세요: ${{ steps.meta.outputs.sha }}"
          docker buildx imagetools inspect "$IMAGE:latest"