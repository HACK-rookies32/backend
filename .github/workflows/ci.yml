name: CI

# PR 에서는 검증만 한다. 이미지는 만들지 않는다.
# main 에 머지되는 순간 cd.yml 이 배포까지 이어서 하므로,
# 여기서 막지 못한 것은 그대로 운영으로 나간다.
on:
  pull_request:
    branches: [main]

# 이 워크플로는 코드를 읽기만 한다. GITHUB_TOKEN 을 최소 권한으로 좁힌다.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 배포판과 의존성 캐시를 함께 관리한다.
      - uses: gradle/actions/setup-gradle@v4

      # 테스트는 외부 DB 없이 통과한다(H2 인메모리, Mongo/Redis 는 지연 연결).
      # 러너에 service container 를 띄울 필요가 없다.
      - name: 테스트
        run: ./gradlew test

      # 실패했을 때 로그만 보고 원인을 찾기 어려우므로 리포트를 남긴다.
      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7