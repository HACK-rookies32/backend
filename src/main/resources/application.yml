spring:
  application:
    name: kidhack-backend
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:h2:mem:kidhackdb;MODE=Oracle
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    mongodb:
      uri: mongodb://localhost:27017/kidhack_chat
    redis:
      host: localhost
      port: 6379
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# ------------------------------------------------------------------
# 헬스체크 (NLB 타깃그룹이 이 엔드포인트를 호출한다)
#
# probes.enabled 는 쿠버네티스로 인식될 때만 자동으로 켜지므로 명시한다.
# 이걸 켜면 /actuator/health/readiness 가 생긴다.
#
# 로드밸런서에는 /actuator/health 가 아니라 readiness 를 물려야 한다.
# 기본 /actuator/health 는 DB·Mongo·Redis 상태를 전부 집계하기 때문에,
# DocumentDB 가 페일오버로 몇 초 흔들리면 WAS 2 대가 "동시에" unhealthy 가 되고
# NLB 에 살아 있는 타깃이 0 이 된다. 지금(TCP 체크)보다 나쁜 상태가 된다.
# readiness 그룹은 "앱이 요청을 받을 준비가 됐는가" 만 본다.
#
# ⚠️ management.endpoints.web.exposure.include 를 추가하지 말 것.
#    SecurityConfig 가 anyRequest().permitAll() 이라 /actuator/env 를 열면
#    DB 비밀번호와 JWT 시크릿이 그대로 노출된다. 기본값(health 만 노출)을 유지한다.
management:
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  secret: local-test-secret-key-change-in-production
  expiration: 3600000

# 위치 추적(location) 도메인 설정
kidhack:
  location:
    retention-days: 3      # 동선 세그먼트 보관 기간(일) — No.2 롤링 삭제
    segment-minutes: 5     # 세그먼트 길이(분)

# ------------------------------------------------------------------
# 첨부파일 저장소
#
# bucket 이 비어 있으면 로컬 디스크에 저장한다. 로컬 개발자가 업로드를
# 테스트할 때마다 AWS 자격증명을 갖춰야 하는 상황을 피하기 위한 폴백이다.
# 저장 위치는 prefix + 분류라 예전과 같은 uploads/community, uploads/inquiry 다.
#
# 운영에서는 WAS 부팅 스크립트가 APP_S3_BUCKET 을 채운다
# (relaxed binding: APP_S3_BUCKET -> app.s3.bucket).
#
# 예전의 file.upload-dir / file.inquiry-upload-dir 는 제거했다. 저장 경로를
# prefix + UploadCategory 로 만들게 되어 읽는 곳이 없어졌다.
# ------------------------------------------------------------------
app:
  s3:
    bucket: ${APP_S3_BUCKET:}
    prefix: uploads
    presign-ttl: 5m
  push:
    provider: mock   # 나중에 firebase로 바꾸면 전환

firebase:
  credentials-path: firebase-service-account.json

