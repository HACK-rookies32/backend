# ------------------------------------------------------------------
# 기본(로컬/CI) 설정.
#
# 여기 있는 DB 설정은 전부 로컬용이다 — H2 인메모리, localhost Mongo/Redis.
# 개발자 PC 와 GitHub Actions 러너는 RDS/DocumentDB/ElastiCache 에 접속할 수
# 없다(프라이빗 서브넷 + 보안그룹이 WAS 에서 오는 트래픽만 허용). 그래서
# ./gradlew test 는 앞으로도 외부 DB 없이 이 설정으로 돈다.
#
# 운영은 prod 프로파일이 아래 값을 덮어쓴다. 실물 application-prod.yml 은
# 레포에 없고 GitHub Secrets(APPLICATION_PROD_YML)에 있으며, cd.yml 이 빌드
# 직전에 복원한다. 어떤 키가 필요한지는 application-prod.yml.example 참고.
# ------------------------------------------------------------------
spring:
  application:
    name: kidhack-backend
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:h2:mem:kidhackdb;MODE=Oracle
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  # 로컬/CI 는 H2 라 Flyway 를 켜지 않는다. 마이그레이션 SQL 이 Oracle 문법이고,
  # 위 ddl-auto 가 엔티티에서 직접 스키마를 만들어 주므로 여기서는 필요가 없다.
  # 운영은 prod yml 이 이 값을 true 로 덮어쓴다.
  flyway:
    enabled: false
  # ⚠️ spring.data.mongodb.uri 가 아니라 spring.mongodb.uri 다.
  #    Spring Boot 4.0 에서 접속 관련 키가 spring.mongodb.* 로 옮겨졌고, 옛 키는
  #    deprecation level=error 라 아예 바인딩되지 않는다. 그런데 Spring 은 모르는
  #    키를 조용히 무시하므로 경고 한 줄 없이 드라이버 기본값(localhost:27017)으로
  #    붙는다. 로컬은 compose 의 mongo 가 거기 있어 "동작하는 것처럼" 보이고,
  #    운영에서는 DocumentDB 주소를 넣어도 무시된 채 localhost 로 붙어 실패한다.
  mongodb:
    uri: mongodb://localhost:27017/kidhack_chat
  data:
    redis:
      host: localhost
      port: 6379
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# ------------------------------------------------------------------
# 헬스체크 (NLB 타깃그룹이 이 엔드포인트를 호출한다)
#
# probes.enabled 는 쿠버네티스로 인식될 때만 자동으로 켜지므로 명시한다.
# 이걸 켜면 /actuator/health/readiness 가 생긴다.
#
# 로드밸런서에는 /actuator/health 가 아니라 readiness 를 물려야 한다.
# 기본 /actuator/health 는 DB·Mongo·Redis 상태를 전부 집계하기 때문에,
# DocumentDB 가 페일오버로 몇 초 흔들리면 WAS 2 대가 "동시에" unhealthy 가 되고
# NLB 에 살아 있는 타깃이 0 이 된다. 지금(TCP 체크)보다 나쁜 상태가 된다.
# readiness 그룹은 "앱이 요청을 받을 준비가 됐는가" 만 본다.
#
# ⚠️ management.endpoints.web.exposure.include 를 추가하지 말 것.
#    SecurityConfig 가 anyRequest().permitAll() 이라 /actuator/env 를 열면
#    DB 비밀번호와 JWT 시크릿이 그대로 노출된다. 기본값(health 만 노출)을 유지한다.
management:
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  secret: local-test-secret-key-change-in-production
  expiration: 3600000

# 위치 추적(location) 도메인 설정
kidhack:
  location:
    retention-days: 3      # 동선 세그먼트 보관 기간(일) — No.2 롤링 삭제
    segment-minutes: 5     # 세그먼트 길이(분)
    
  monitoring:
    retention-days: 7      # 앱 사용량 보관 기간(일) — No.13 롤링 삭제
  wallet:
    charge-order-expiry-minutes: 30   # 승인 안 된 READY 충전 주문 만료 시간(분) — C-2 만료 배치
  # 카드 CRD E2E 암호화 (역할표 추가요청 · 금취분평 대응)
  card:
    # 저장 필드암호화용 AES-256 키(Base64 32바이트). 운영은 반드시 시크릿으로 주입.
    # 비우면 기동 시 임시 키를 생성한다(로컬 H2는 재시작마다 초기화되므로 무방).
    storage-key: ""
    # RSA 키 회전 주기(일). keyId는 프론트가 실시간 조회하므로 회전해도 앱 무영향.
    key-rotation-days: 90
    # 재전송 방지 nonce 유효창(초).
    nonce-ttl-seconds: 60

# ------------------------------------------------------------------
# 첨부파일 저장소
#
# bucket 이 비어 있으면 로컬 디스크에 저장한다. 로컬 개발자가 업로드를
# 테스트할 때마다 AWS 자격증명을 갖춰야 하는 상황을 피하기 위한 폴백이다.
# 저장 위치는 prefix + 분류라 예전과 같은 uploads/community, uploads/inquiry 다.
#
# 운영에서는 WAS 부팅 스크립트가 APP_S3_BUCKET 을 채운다
# (relaxed binding: APP_S3_BUCKET -> app.s3.bucket).
#
# 예전의 file.upload-dir / file.inquiry-upload-dir 는 제거했다. 저장 경로를
# prefix + UploadCategory 로 만들게 되어 읽는 곳이 없어졌다.
# ------------------------------------------------------------------
app:
  s3:
    bucket: ${APP_S3_BUCKET:}
    prefix: uploads
    presign-ttl: 5m
  push:
    # mock     : 실제로 보내지 않고 로그만 남긴다. 로컬/CI 기본값.
    # firebase : FCM 실발송. firebase.credentials-path 의 서비스 계정 키가 있어야 한다.
    #            prod yml 이 이 값을 firebase 로 덮어쓴다.
    provider: mock
  chat:
    # local : 자기 JVM 안에서만 전달. Redis 없이 도는 로컬/CI 기본값이다.
    # redis : Redis pub/sub 을 거쳐 모든 WAS 인스턴스에 전달한다.
    #         운영은 WAS 가 2 대라 반드시 redis 여야 하고, prod yml 이 이 값을 덮어쓴다.
    broker: local

# 서비스 계정 키 위치. classpath: / file: 접두사로 구분한다(PushConfig 가 ResourceLoader 로 읽음).
# 로컬은 src/main/resources 에 파일을 두고, 운영은 컨테이너에 마운트된 경로를 쓴다.
# 이 파일은 .gitignore / .dockerignore 양쪽에서 막혀 있어 커밋·이미지에 실리지 않는다.
firebase:
  credentials-path: classpath:firebase-service-account.json

server:
  tomcat:
    uri-encoding: UTF-8

# ------------------------------------------------------------------
# OpenAPI(Swagger) — /swagger-ui.html, JSON 은 /v3/api-docs
# 도메인별 SecurityConfig 의 securityMatcher 가 이 경로들을 잡지 않아
# 전역 permitAll 로 열려 있다(모의해킹용, 의도).
# ------------------------------------------------------------------
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha      # 오퍼레이션을 경로/메서드 알파벳순으로
    tags-sorter: alpha            # 태그(그룹)도 알파벳순으로
    doc-expansion: none           # 처음엔 태그만 접힌 상태로 표시
    display-request-duration: true
    persist-authorization: true   # 새로고침해도 Authorize 토큰 유지
    try-it-out-enabled: true
  default-produces-media-type: application/json

