spring:
  application:
    name: kidhack-backend
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:h2:mem:kidhackdb;MODE=Oracle
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    mongodb:
      uri: mongodb://localhost:27017/kidhack_chat
    redis:
      host: localhost
      port: 6379

jwt:
  secret: local-test-secret-key-change-in-production
  expiration: 3600000

# 위치 추적(location) 도메인 설정
kidhack:
  location:
    retention-days: 3      # 동선 세그먼트 보관 기간(일) — No.2 롤링 삭제
    segment-minutes: 5     # 세그먼트 길이(분)