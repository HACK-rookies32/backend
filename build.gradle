plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'kidhack-backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}
dependencies {
    // 웹 / 기본
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // DB (JPA + Oracle, 로컬 테스트는 H2)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-h2console'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.oracle.database.jdbc:ojdbc11:23.26.3.0.0'

    // NoSQL (채팅용)
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

    // 캐시/세션 등
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // 웹소켓 (채팅 실시간 통신)
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // 인증/보안
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // 헬스체크 — 배포 자동화의 안전망.
    // NLB 헬스체크가 TCP 라 "포트가 열렸는가" 만 보는데, Watchtower 가 사람 손 없이
    // 컨테이너를 교체하는 구조에서는 "앱이 요청을 받을 수 있는가" 를 물어야 한다.
    // 기동에 실패한 컨테이너에 트래픽이 계속 들어가는 것을 막는다.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // FCM 푸시 알림
    implementation 'com.google.firebase:firebase-admin:9.4.1'

    // S3 (첨부파일 저장 + presigned URL 발급)
    // Spring Boot BOM 에 AWS SDK 가 없어 버전을 직접 지정한다.
    // s3 와 presigner 의 버전이 어긋나면 런타임에 NoSuchMethodError 가 나므로
    // BOM 으로 묶어 한 곳에서만 올린다.
    implementation platform('software.amazon.awssdk:bom:2.54.4')
    implementation 'software.amazon.awssdk:s3'

    // API 명세서
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

    // 롬복
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 개발 편의
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

    // 테스트
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-mongodb-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// application-prod.yml.example 은 "prod 프로파일에 어떤 키가 필요한가" 를 레포에
// 남기기 위한 템플릿이라 실행 시점에는 아무도 읽지 않는다. jar 에 넣지 않는다.
// (실물 application-prod.yml 은 cd.yml 이 빌드 직전에 복원하므로 그대로 포함된다)
tasks.named('processResources') {
    exclude 'application-prod.yml.example'
}